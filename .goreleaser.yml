# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
---
version: 2

project_name: extract-sbom

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/extract-sbom
    binary: extract-sbom
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/TomTonic/extract-sbom/internal/buildinfo.ReleaseVersion={{.Version}}

nfpms:
  - package_name: extract-sbom
    vendor: TomTonic
    homepage: https://github.com/TomTonic/extract-sbom
    maintainer: Tom Tonic <tom@tomtonic.de>
    description: |
      Standardized incoming inspection for software deliveries. Given one input
      file (archive, installer, or container), extract-sbom recursively unpacks
      nested formats and produces one consolidated SBOM (CycloneDX JSON,
      CycloneDX XML, or SPDX JSON) plus one auditable report (Markdown, HTML,
      JSON, SARIF, or any combination).
    license: BSD-3-Clause
    section: admin
    priority: optional
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    contents:
      - src: ./README.md
        dst: /usr/share/doc/extract-sbom/README.md
      - src: ./LICENSE
        dst: /usr/share/doc/extract-sbom/LICENSE
    overrides:
      deb:
        recommends:
          - 7zip
          - p7zip-full
          - unshield
          - squashfs-tools
          - bubblewrap
      rpm:
        recommends:
          - p7zip
          - p7zip-plugins
          - unshield
          - squashfs-tools
          - bubblewrap
      apk:
        dependencies:
          - p7zip
          - unshield
          - squashfs-tools
          - bubblewrap
      archlinux:
        # 7zip, not p7zip: Arch dropped p7zip and the current package both
        # provides and replaces it. Depending on the name that actually
        # exists avoids relying on a legacy alias that can be retired.
        dependencies:
          - 7zip
          - unshield
          - squashfs-tools
          - bubblewrap

archives:
  - formats: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: zip

homebrew_casks:
  - name: extract-sbom
    repository:
      owner: TomTonic
      name: homebrew-tap
      branch: main
      # Pushed over SSH with a deploy key rather than through the API with a
      # personal access token. A deploy key is valid for exactly this one
      # repository and can be revoked on its own; a PAT that can write to the
      # tap would necessarily be an account-wide credential. GoReleaser takes
      # the key material itself here, not a path, and refuses a
      # passphrase-protected key (it runs unattended).
      git:
        url: git@github.com:TomTonic/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    commit_author:
      name: Tom Tonic
      email: tom@tomtonic.de
    homepage: https://github.com/TomTonic/extract-sbom
    # Both of these must stay single-line. GoReleaser emits `desc` as one Ruby
    # string literal (Homebrew expects a one-liner there anyway) and renders
    # each line of `caveats` as its own literal inside the caveats block - so
    # in a multi-line caveat only the last line would be the block's return
    # value and everything above it would silently vanish from `brew info`.
    description: Recursively unpacks software deliveries into one SBOM and audit report
    binaries:
      - extract-sbom
    caveats: Some input formats (CAB, 7z, MSI, RAR, InstallShield, Squashfs) need external tools that are not bundled - see https://github.com/TomTonic/extract-sbom/blob/main/INSTALL.md

    # The Linux packages declare these as dependencies, so the cask does too -
    # otherwise `brew install` leaves a tool that cannot open half the formats
    # it advertises. Homebrew has no weak-dependency mechanism, so unlike the
    # deb/rpm `Recommends:` these are hard requirements; that matches what the
    # Arch and Alpine packages already do. bubblewrap is deliberately absent:
    # the sandbox is Linux-only.
    dependencies:
      - formula: sevenzip
      - formula: unshield
      - formula: squashfs
    hooks:
      post:
        # Homebrew Cask sets com.apple.quarantine on everything it stages.
        # These binaries are ad-hoc (linker) signed rather than Developer ID
        # signed and notarized, so Gatekeeper does not just warn - it SIGKILLs
        # the process, and `extract-sbom --version` dies with exit 137 and no
        # output at all. Clearing the attribute is what makes the cask usable.
        # The integrity guarantee does not rest on Apple here: Homebrew has
        # already verified the download against the sha256 pinned above.
        # must_succeed: false because xattr exits non-zero when the attribute
        # is not present, which is the case on re-installs.
        install: |
          system_command "/usr/bin/xattr",
                         args: ["-dr", "com.apple.quarantine", "#{staged_path}/extract-sbom"],
                         must_succeed: false

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^deps-upd:'
      - Merge pull request
      - Merge branch
